; Top-level PJSIP config — transport + includes only. Nothing secret lives
; in this file, so it's the one piece of pjsip config safe to commit as-is.
;
; The two includes below hold real credentials on the server and are NOT
; committed — see the matching *.conf.example templates in this same
; directory and README.md "Deploying" for how to turn each into the real
; file (chmod 640, owned by asterisk:asterisk).

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Uncomment and set if this box is behind NAT with a static public IP
; (typical for a cloud VM) — without this, Airtel's media/signaling may
; try to reach your private RFC1918 address instead of the public one.
; external_media_address=YOUR_SERVER_PUBLIC_IP
; external_signaling_address=YOUR_SERVER_PUBLIC_IP
; local_net=10.0.0.0/8
; local_net=172.16.0.0/12
; local_net=192.168.0.0/16

; WebSocket transport for the browser-based softphone (Prompt C —
; frontend/src/calling/softphone.ts, SIP.js over WSS). Extension endpoints
; that set webrtc=yes / transport=transport-wss (see
; pjsip.internal.conf.example) register and receive calls over this instead
; of plain UDP. Needs three things this file alone doesn't provide:
;   1. res_http_websocket + res_pjsip_transport_websocket must be loaded
;      (default in most Asterisk builds — check `module show like websocket`).
;   2. http.conf must enable the HTTP server with TLS:
;        [general]
;        enabled=yes
;        tlsenable=yes
;        tlsbindaddr=0.0.0.0:8089
;        tlscertfile=/etc/asterisk/keys/asterisk.pem   ; real cert, not self-signed, for browsers to trust it
;        tlsprivatekey=/etc/asterisk/keys/asterisk.key
;   3. backend/.env's ASTERISK_WSS_URI must match this box's public
;      wss://<domain>:8089/ws — see backend/.env.example.
; Commented out by default (matches TELEPHONY_PROVIDER=mock needing no
; Asterisk at all) — uncomment once http.conf's TLS cert is in place.
; [transport-wss]
; type=transport
; protocol=wss
; bind=0.0.0.0

#include pjsip.airtel_trunk.conf
#include pjsip.internal.conf
