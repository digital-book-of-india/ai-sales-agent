; ============================================================================
; Dialplan. No secrets here — safe to commit as-is.
;
; Call flow summary:
;   Inbound (Airtel -> us):  [from-airtel]      -> [internal-ring] or [ai-bridge]
;   Outbound (backend -> AMI Originate):  [outbound-bridge] -> [internal-ring] or [ai-bridge]
;   Internal softphone dialing out:       [from-internal]   -> PSTN via airtel-trunk
;
; Every leg that reaches [internal-ring] or [ai-bridge] has already had
; MixMonitor started on it, so both directions and both bridge targets are
; recorded uniformly.
; ============================================================================

[globals]
; "ai-bridge" streams the call to the AI voice pipeline over AudioSocket;
; anything else rings the internal extension(s) instead. The backend
; overrides this per-call for outbound (see outbound-bridge below); this
; global only controls the *inbound* default.
INBOUND_DESTINATION=internal
; host:port the Node backend's AudioSocket TCP server listens on — must
; match AUDIOSOCKET_HOST/AUDIOSOCKET_PORT in backend/.env exactly.
AI_AUDIOSOCKET_SERVICE=127.0.0.1:9019
; Where MixMonitor writes call recordings. Must match ASTERISK_RECORDINGS_DIR
; used by the nginx internal-only vhost that serves them back to the backend
; (see ../nginx/recordings-internal.conf) and be writable by the asterisk user.
RECORDINGS_DIR=/var/spool/asterisk/recordings
; Extension a plain internal "ring the team" call lands on.
INTERNAL_RING_EXTEN=1001

; ----------------------------------------------------------------------------
; Inbound: calls arriving from the Airtel trunk (context=from-airtel on the
; airtel-trunk endpoint — see pjsip.airtel_trunk.conf.example).
; ----------------------------------------------------------------------------
[from-airtel]
exten => _X.,1,NoOp(Inbound Airtel call from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 ; UUID() needs Asterisk 18.6+/20+ (func_uuid). Older versions: replace with
 ; Set(CALLUUID=${SHELL(uuidgen -r)}) instead (strip the trailing newline).
 same => n,Set(CALLUUID=${UUID()})
 same => n,MixMonitor(${RECORDINGS_DIR}/${CALLUUID}.wav,b)
 same => n,GotoIf($["${INBOUND_DESTINATION}" = "ai-bridge"]?ai-bridge,s,1:internal-ring,s,1)

; ----------------------------------------------------------------------------
; Outbound: entry point for calls the backend originates via AMI (see
; backend/src/calling/telephony/asterisk.provider.ts). The Originate action
; sets ChannelId to a backend-generated UUID, so ${CHANNEL(uniqueid)} on this
; channel already equals that UUID — that's also what AsteriskProvider stores
; as Call.providerCallId, and what MixMonitor's filename below reuses so
; AsteriskProvider.getRecording() can build the recording URL with no extra
; lookup. BRIDGE_TARGET ("ai" or "manual") and, for "manual", TARGET_EXTENSION
; are set as Originate Variables — one per callMode/salesUserId the dialer
; decided before originating (see AsteriskProvider.initiateCall).
; ----------------------------------------------------------------------------
[outbound-bridge]
exten => s,1,NoOp(Outbound call ${CHANNEL(uniqueid)} answered, connecting)
 same => n,Answer()
 same => n,Set(CALLUUID=${CHANNEL(uniqueid)})
 same => n,MixMonitor(${RECORDINGS_DIR}/${CALLUUID}.wav,b)
 same => n,GotoIf($["${BRIDGE_TARGET}" = "ai"]?ai-bridge,s,1:internal-ring,s,1)

; ----------------------------------------------------------------------------
; Bridges the current channel's audio to the backend's AI voice pipeline over
; AudioSocket. CALLUUID must already be set by whichever context Goto'd here.
; ----------------------------------------------------------------------------
[ai-bridge]
exten => s,1,NoOp(Bridging call ${CALLUUID} to AI voice pipeline at ${AI_AUDIOSOCKET_SERVICE})
 same => n,AudioSocket(${CALLUUID},${AI_AUDIOSOCKET_SERVICE})
 same => n,Hangup()

; ----------------------------------------------------------------------------
; Bridges the current channel to an internal extension/softphone instead of
; the AI. Used for inbound calls with INBOUND_DESTINATION=internal, and for
; outbound MANUAL calls (BRIDGE_TARGET=manual) — TARGET_EXTENSION carries the
; sales user's own registered extension in that case (see
; AsteriskProvider.initiateCall); anything without one (plain inbound calls)
; falls back to the shared INTERNAL_RING_EXTEN global.
; ----------------------------------------------------------------------------
[internal-ring]
exten => s,1,NoOp(Ringing extension ${TARGET_EXTENSION})
 same => n,Set(RING_EXTEN=${IF($["${TARGET_EXTENSION}" != ""]?${TARGET_EXTENSION}:${INTERNAL_RING_EXTEN})})
 same => n,Dial(PJSIP/${RING_EXTEN},30)
 same => n,Hangup()

[transfer-target]
; AMI Redirect (see AsteriskProvider.transferCall) points the live channel
; here with Exten=<targetAgentId>, so ${EXTEN} is the destination extension.
exten => _X.,1,NoOp(Transferring to extension ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; ----------------------------------------------------------------------------
; A human agent's registered softphone (e.g. extension 1001, see
; pjsip.internal.conf.example) dialing out through the Airtel trunk. NOT
; used by the backend dialer — that originates straight into
; [outbound-bridge] above via AMI, bypassing this context entirely.
; ----------------------------------------------------------------------------
[from-internal]
exten => _X.,1,NoOp(Internal extension ${CALLERID(num)} dialing out to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@airtel-trunk,60)
 same => n,Hangup()
