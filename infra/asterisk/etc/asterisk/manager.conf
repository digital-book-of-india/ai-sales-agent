; ============================================================================
; AMI (Asterisk Manager Interface) — general settings. No secrets here; the
; backend's AMI user/password/IP allowlist lives in manager.d/backend.conf,
; which is NOT committed (see manager.d/backend.conf.example + README.md).
;
; SECURITY: AMI is full call-control (originate/hangup/redirect) plus a live
; feed of every call event — it must never be reachable from the public
; internet. `bind` below keeps it off the trunk-facing interface entirely;
; the per-user `permit`/`deny` in backend.conf then restricts even LAN access
; to the backend server's own IP; and the firewall script in ../firewall/
; blocks port 5038 at the network layer too. All three layers are
; deliberate — losing any one of them still leaves AMI closed.
; ============================================================================

[general]
enabled = yes
port = 5038
; Only listen on loopback/internal interfaces. If the backend runs on this
; same box, 127.0.0.1 is enough — remove/replace with the server's private
; LAN IP (e.g. 10.0.0.5) if the backend runs on a separate internal host.
; NEVER set this to 0.0.0.0 or a public IP.
bindaddr = 127.0.0.1
displayconnects = yes
allowmultiplelogin = no

#include manager.d/backend.conf
