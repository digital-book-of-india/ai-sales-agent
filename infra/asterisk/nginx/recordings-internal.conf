# Internal-only static file server for call recordings, so the backend's
# RecordingsService can `fetch()` a recording the exact same way regardless
# of which TelephonyProvider is active (see backend/src/calling/recordings/
# recordings.service.ts — fetchAudio() just does `fetch(recording.recordingUrl)`,
# no provider-specific code). AsteriskProvider.getRecording() builds a
# time-limited signed URL against this vhost using nginx's secure_link
# module — same "short-lived signed link" idea RecordingsService already
# uses for its own /stream endpoint, just one layer further down.
#
# Requires an nginx build with ngx_http_secure_link_module (nginx-full or
# nginx-extras on Debian/Ubuntu — `nginx -V 2>&1 | grep -o secure_link` to
# check; nginx-light does NOT include it).
#
# Install:
#   cp recordings-internal.conf /etc/nginx/sites-available/recordings-internal
#   ln -s /etc/nginx/sites-available/recordings-internal /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# ASTERISK_RECORDINGS_SECRET below must be the exact same value as
# ASTERISK_RECORDINGS_SECRET in the backend's .env — generate one with
# `openssl rand -hex 32` and set it in both places, never in git.

server {
    listen 127.0.0.1:8088;
    # If the backend runs on a separate host, bind to this server's private
    # LAN IP instead of 127.0.0.1 (e.g. `listen 10.0.0.9:8088;`) — never
    # 0.0.0.0 or a public IP. `allow`/`deny` below is a second, redundant
    # layer on top of that, same defense-in-depth reasoning as manager.conf.
    server_name _;

    location /recordings/ {
        allow 10.0.0.5;   # <- replace with the backend server's real IP
        deny all;

        alias /var/spool/asterisk/recordings/;

        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri ASTERISK_RECORDINGS_SECRET";

        if ($secure_link = "") { return 403; }
        if ($secure_link = "0") { return 410; }

        # Recordings are wav (MixMonitor default) — see extensions.conf.
        default_type audio/wav;
    }

    location / {
        deny all;
    }
}
